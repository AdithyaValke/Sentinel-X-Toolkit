services:
  - type: web
    name: payload-workbench-api
    runtime: python
    rootDir: security-payload-workbench-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 30 app:app
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RATE_LIMIT_STORAGE_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "60"
